<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">
    <title>Wayne Secure Dashboard</title>

    <link rel="stylesheet" href="style.css">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&display=swap"
          rel="stylesheet">

</head>

<body class="dashboard-body">

    <!-- HEADER -->
    <header class="dashboard-header">

        <h1>WAYNE SECURITY DASHBOARD</h1>

        <p>Gotham City Monitoring System</p>

    </header>

    <!-- GRID PRINCIPAL -->
    <section class="dashboard-grid">

        <div class="card">
            <h2>Gotham Status</h2>
            <p>Stable / Low Threat Level</p>
        </div>

        <div class="card">
            <h2>Active Projects</h2>
            <p>12 Classified Projects Running</p>
        </div>

        <div class="card">
            <h2>Security Network</h2>
            <p>98% Operational</p>
        </div>

        <div class="card alert">
            <h2>System Alert</h2>
            <p>No anomalies detected</p>
        </div>

    </section>

</body>

</html>
